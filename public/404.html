<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<title>Page not found · API Bench</title>
<meta name="description" content="This page does not exist." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{--bg:#fafaf8;--ink:#111;--ink-2:#404040;--muted:#666;--rule:rgb(17 17 17/.08)}
@media (prefers-color-scheme:dark){:root{--bg:#181818;--ink:#f5f5f5;--ink-2:#cfcfcf;--muted:#9b9b9b;--rule:rgb(255 255 255/.08)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Geist,ui-sans-serif,system-ui,sans-serif;font-size:16px;line-height:24px;-webkit-font-smoothing:antialiased}
main{max-width:680px;margin:0 auto;padding:96px 16px 80px}
h1{font-size:36px;line-height:40px;font-weight:600;letter-spacing:-.025em;margin:0;text-wrap:balance}
p,li{color:var(--ink-2);text-wrap:pretty}
p{margin:16px 0 0}
.caption{font-size:14px;line-height:20px;color:var(--muted);margin:0 0 12px}
a.back{display:inline-flex;align-items:center;gap:8px;margin-top:32px;padding:8px 12px;border-radius:8px;background:var(--ink);color:var(--bg);font-weight:600;text-decoration:none;transition:opacity 300ms cubic-bezier(.22,1,.36,1),transform 300ms cubic-bezier(.22,1,.36,1)}
a.back:hover{opacity:.88}
a.back:active{transform:scale(.98)}
a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<main>
<p class="caption">404</p>
<h1>This page did not survive the migration</h1>
<p>The address you followed does not exist, or it moved. Head back to the home page and start from there.</p>
<a class="back" href="/">Back to API Bench</a>
</main>
</body>
</html>
